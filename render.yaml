services:
  - type: web
    name: snapnest-dispatch
    runtime: node
    plan: free
    region: virginia
    branch: main
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeployTrigger: checksPass
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: SUPABASE_URL
        value: https://bihtmrtbsombubfsdbjd.supabase.co
      - key: SUPABASE_TENANT_SLUG
        value: demo-base
      - key: DISPATCH_REQUIRE_AUTH
        value: "true"
      - key: SUPABASE_PUBLISHABLE_KEY
        value: sb_publishable_lD1QorqGwPWdZ2Xhj4APkg_mn4Dm-IC
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: WHATSAPP_ADAPTER_KEY
        generateValue: true
      - key: WHATSAPP_PUBLIC_NUMBER
        sync: false
      - key: WHATSAPP_VERIFY_TOKEN
        generateValue: true
      - key: WHATSAPP_APP_SECRET
        sync: false
      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false
      - key: PTT_PROVIDER
        value: livekit
      - key: LIVEKIT_URL
        sync: false
      - key: LIVEKIT_API_KEY
        sync: false
      - key: LIVEKIT_API_SECRET
        sync: false
