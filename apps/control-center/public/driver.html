<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Driver · SnapNest Dispatch</title><link rel="stylesheet" href="/styles.css"></head><body><main class="shell" style="max-width:700px"><div class="topbar"><div class="brand"><div class="logo">SD</div><div><strong id="driverName">Driver</strong><div class="muted">Driver console</div></div></div><a class="btn secondary" href="/">Dispatch</a></div><div class="card"><div class="row" style="justify-content:space-between"><h2 style="margin:0">Driver status</h2><span id="status" class="badge"></span></div><div class="row" style="margin-top:15px"><button class="btn success" data-status="available">Available</button><button class="btn secondary" data-status="unavailable">Unavailable</button><button class="btn secondary" data-status="offline">Off duty</button></div><div id="gps" class="muted" style="margin-top:12px">Waiting for GPS…</div></div><div class="card" style="margin-top:16px"><h2>Incoming job</h2><div id="job" class="muted">No active offer.</div></div><div class="card" style="margin-top:16px"><h2>Floating PTT concept</h2><p class="muted">The Android app provides the real movable system overlay. This browser control is only a behavior preview.</p><button id="ptt" class="btn" style="width:100%;height:76px;border-radius:38px;font-size:17px">Hold to talk to Dispatch</button><div id="pttState" class="muted" style="text-align:center;margin-top:8px">Microphone idle</div></div></main><script type="module">
import { api } from '/session.js';
import { escapeHtml } from '/modules/format.js';
let id=new URLSearchParams(location.search).get('driver')||'',current=null;
async function resolveDriver(){if(id)return;const me=await api('/api/auth/me');id=me.driver?.id||'';if(!id)throw new Error('This account is not linked to a driver.');}
async function render(){await resolveDriver();const s=await api('/api/state');const d=s.drivers.find(x=>x.id===id);document.querySelector('#driverName').textContent=d?`${d.name} · ${d.vehicle}`:'Unknown driver';const st=document.querySelector('#status');st.className=`badge ${['available','offered','busy','unavailable','offline'].includes(d?.status)?d.status:'unknown'}`;st.innerHTML=`<i class="dot"></i>${escapeHtml(d?.status||'unknown')}`;document.querySelector('#gps').textContent=d?.location?`GPS: ${d.location.lat.toFixed(5)}, ${d.location.lng.toFixed(5)}`:'Waiting for GPS…';current=s.bookings.find(b=>b.currentOfferDriverId===id);document.querySelector('#job').innerHTML=current?`<div><strong>${escapeHtml(current.pickup?.label)}</strong> → ${escapeHtml(current.destination?.label)}</div><div class="muted" style="margin:7px 0 12px">${escapeHtml(current.passengerName)} · ${Number(current.passengers)||1} passenger(s)</div><div class="row"><button class="btn success" id="accept">Accept</button><button class="btn danger" id="decline">Decline</button></div>`:'No active offer.';if(current){document.querySelector('#accept').onclick=()=>respond(true);document.querySelector('#decline').onclick=()=>respond(false)}}
async function respond(accept){await api(`/api/bookings/${current.id}/offer-response`,{method:'POST',body:JSON.stringify({driverId:id,accept})});render()}
document.querySelectorAll('[data-status]').forEach(b=>b.onclick=async()=>{await resolveDriver();await api(`/api/drivers/${id}/status`,{method:'POST',body:JSON.stringify({status:b.dataset.status})});render()});const p=document.querySelector('#ptt'),label=document.querySelector('#pttState');const down=()=>{label.textContent='Transmitting to Dispatch…';p.textContent='Release to stop';};const up=()=>{label.textContent='Microphone idle';p.textContent='Hold to talk to Dispatch';};p.onpointerdown=down;p.onpointerup=up;p.onpointercancel=up;p.onpointerleave=e=>{if(e.buttons)up()};await render();setInterval(render,1500);
</script></body></html>
