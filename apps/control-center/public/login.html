<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sign in · SnapNest Dispatch</title><link rel="stylesheet" href="/styles.css"></head><body><main class="shell" style="max-width:520px;padding-top:8vh"><div class="card"><div class="brand" style="margin-bottom:24px"><div class="logo">SD</div><div><strong>SnapNest Dispatch</strong><div class="muted">Base access</div></div></div><form id="loginForm"><label>Email</label><input id="email" type="email" autocomplete="username" required style="width:100%;margin:8px 0 16px"><label>Password</label><input id="password" type="password" autocomplete="current-password" required style="width:100%;margin:8px 0 16px"><button class="btn" style="width:100%" type="submit">Sign in</button><div id="error" class="muted" style="margin-top:14px"></div></form></div></main><script type="module">
import { signIn } from '/supabase-client.js';
import { saveSession } from '/session.js';
const form=document.querySelector('#loginForm'),error=document.querySelector('#error');
form.onsubmit=async(e)=>{e.preventDefault();error.textContent='Signing in…';try{const session=await signIn(document.querySelector('#email').value,document.querySelector('#password').value);saveSession(session);const next=new URLSearchParams(location.search).get('next')||'/';location.href=next;}catch(err){error.textContent=err.message;}};
</script></body></html>
