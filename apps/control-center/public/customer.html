<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Book a Taxi · SnapNest Dispatch</title><link rel="stylesheet" href="/styles.css"></head><body><main class="shell" style="max-width:760px"><div class="hero"><div class="brand"><div class="logo">SD</div><div><strong>SnapNest Dispatch</strong><div class="muted">WhatsApp-style booking simulator</div></div></div><h1>Book a taxi without another app.</h1><p>This simulates the structured booking that WhatsApp will create after the customer shares a location and confirms the destination.</p></div><div class="card"><form id="form">
<div class="field"><label>Passenger name</label><input name="passengerName" value="Demo Passenger"></div>
<div class="field"><label>Pickup</label><select name="pickup"><option value="albertown">Albertown / Fifth Street</option><option value="stabroek">Stabroek Market</option><option value="movietowne">MovieTowne</option><option value="giftland">Giftland Mall</option></select></div>
<div class="field"><label>Destination</label><input name="destination" value="Diamond, East Bank Demerara"></div>
<div class="field"><label>Passengers</label><input name="passengers" type="number" min="1" max="8" value="1"></div>
<div class="field"><label>Notes</label><textarea name="notes" placeholder="Landmark, luggage, special instructions"></textarea></div>
<div class="row"><button class="btn success">Request taxi</button><a class="btn secondary" href="/">Back to dispatch</a></div></form><div id="result" style="margin-top:15px"></div></div></main><script>
const places={albertown:{label:'Fifth Street, Albertown',lat:6.8208,lng:-58.1551},stabroek:{label:'Stabroek Market',lat:6.8121,lng:-58.1646},movietowne:{label:'MovieTowne',lat:6.8196,lng:-58.1219},giftland:{label:'Giftland Mall',lat:6.8237,lng:-58.1174}};
document.querySelector('#form').onsubmit=async(e)=>{e.preventDefault();const f=new FormData(e.target);const payload={passengerName:f.get('passengerName'),passengers:Number(f.get('passengers')),notes:f.get('notes'),pickup:places[f.get('pickup')],destination:{label:f.get('destination')}};const r=await fetch('/api/bookings',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(payload)});const data=await r.json();document.querySelector('#result').innerHTML=r.ok?`<div class="notice"><strong>${data.id}</strong> created. The dispatch engine is now offering the job to a suitable driver.</div>`:`<div class="notice">${data.error}</div>`;};
</script></body></html>
