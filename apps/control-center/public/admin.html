<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin · SnapNest Dispatch</title><link rel="stylesheet" href="/styles.css"></head><body><main class="shell" style="max-width:760px"><div class="topbar"><div class="brand"><div class="logo">SD</div><div><strong>SnapNest Dispatch</strong><div class="muted">Admin · Operator onboarding</div></div></div><div class="row"><a class="btn secondary" href="/">Back to control center</a><button id="logout" class="btn secondary">Sign out</button></div></div><section class="card"><h2>Add dispatcher or driver</h2><p class="muted">Create a login for an operator in this taxi base. Driver accounts are automatically linked to a driver profile.</p><form id="userForm"><div class="grid" style="grid-template-columns:1fr 1fr"><div class="field"><label>Email</label><input id="email" type="email" required autocomplete="off"></div><div class="field"><label>Role</label><select id="role"><option value="dispatcher">Dispatcher</option><option value="driver">Driver</option><option value="admin">Admin</option></select></div></div><div class="grid" style="grid-template-columns:1fr auto"><div class="field"><label>Temporary password</label><input id="password" type="text" minlength="12" required autocomplete="off"></div><div class="field"><label>&nbsp;</label><button id="generate" class="btn secondary" type="button">Generate</button></div></div><div id="driverFields" style="display:none"><div class="grid" style="grid-template-columns:1fr 1fr"><div class="field"><label>Driver name</label><input id="displayName" autocomplete="off"></div><div class="field"><label>Vehicle plate</label><input id="vehiclePlate" autocomplete="off"></div></div><div class="field"><label>Phone</label><input id="phone" inputmode="tel" autocomplete="off"></div></div><button class="btn" type="submit">Create account</button><div id="result" class="muted" style="margin-top:14px"></div></form></section></main><script type="module">
import { accessToken, membership, clearSession } from '/session.js';
import { createOperator } from '/supabase-client.js';
const m=membership();if(!accessToken()){location.href='/login.html?next=/admin.html';}else if(m?.role!=='admin'){location.href='/';}
const $=s=>document.querySelector(s),role=$('#role'),driverFields=$('#driverFields'),result=$('#result');
function toggleDriver(){driverFields.style.display=role.value==='driver'?'block':'none';$('#displayName').required=role.value==='driver';}
role.onchange=toggleDriver;toggleDriver();
$('#generate').onclick=()=>{const alphabet='ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz23456789!@#$%';const bytes=crypto.getRandomValues(new Uint8Array(18));$('#password').value=Array.from(bytes,b=>alphabet[b%alphabet.length]).join('');};
$('#userForm').onsubmit=async(e)=>{e.preventDefault();result.textContent='Creating account…';try{const data=await createOperator(accessToken(),{email:$('#email').value,password:$('#password').value,role:role.value,displayName:$('#displayName').value,phone:$('#phone').value,vehiclePlate:$('#vehiclePlate').value});result.innerHTML=`<div class="notice"><strong>Created.</strong> ${data.user.email} is now ${data.user.role}.</div>`;e.target.reset();role.value='dispatcher';toggleDriver();}catch(err){result.textContent=err.message;}};
$('#logout').onclick=()=>{clearSession();location.href='/login.html';};
</script></body></html>
