<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
  <link href="https://unpkg.com/maplibre-gl@5.7.1/dist/maplibre-gl.css" rel="stylesheet" />
  <script src="https://unpkg.com/maplibre-gl@5.7.1/dist/maplibre-gl.js"></script>
  <style>
    html,body,#map{margin:0;width:100%;height:100%;background:#0d2a40;overflow:hidden}
    .maplibregl-map{filter:brightness(.72) saturate(.78)}
    .maplibregl-ctrl-bottom-left,.maplibregl-ctrl-bottom-right{display:none}
    .marker{width:20px;height:20px;border-radius:50%;box-shadow:0 0 0 5px rgba(255,255,255,.16)}
    .driver{background:#ef6a00;border:3px solid white}
    .pickup{background:white;border:3px solid #173f5f}
    .destination{background:#ef6a00;border:3px solid #0d2a40}
    .label{position:absolute;left:14px;top:14px;z-index:3;background:rgba(13,42,64,.88);color:#fff;padding:8px 11px;border-radius:12px;font:600 11px system-ui;letter-spacing:.2px}
  </style>
</head>
<body>
  <div class="label" id="label">LIVE LOCATION</div>
  <div id="map"></div>
  <script>
    const map = new maplibregl.Map({
      container:'map',
      style:'https://tiles.openfreemap.org/styles/liberty',
      center:[-58.155,6.812],
      zoom:12.4,
      attributionControl:false,
      dragRotate:false,
      pitchWithRotate:false
    });
    let driverMarker, pickupMarker, destinationMarker;
    function marker(className, lng, lat){
      const el=document.createElement('div'); el.className='marker '+className;
      return new maplibregl.Marker({element:el}).setLngLat([lng,lat]).addTo(map);
    }
    function fit(){
      const pts=[];
      [driverMarker,pickupMarker,destinationMarker].forEach(m=>{ if(m) pts.push(m.getLngLat()); });
      if(pts.length===0) return;
      if(pts.length===1){ map.easeTo({center:[pts[0].lng,pts[0].lat],zoom:15,duration:500}); return; }
      const b=new maplibregl.LngLatBounds(); pts.forEach(p=>b.extend(p));
      map.fitBounds(b,{padding:52,maxZoom:15,duration:550});
    }
    window.snapnestSetDriverLocation=function(lat,lng){
      if(!Number.isFinite(lat)||!Number.isFinite(lng)) return;
      if(!driverMarker) driverMarker=marker('driver',lng,lat); else driverMarker.setLngLat([lng,lat]);
      fit();
    }
    window.snapnestSetJob=function(pLat,pLng,dLat,dLng,label){
      if(pickupMarker){pickupMarker.remove();pickupMarker=null}
      if(destinationMarker){destinationMarker.remove();destinationMarker=null}
      if(Number.isFinite(pLat)&&Number.isFinite(pLng)) pickupMarker=marker('pickup',pLng,pLat);
      if(Number.isFinite(dLat)&&Number.isFinite(dLng)) destinationMarker=marker('destination',dLng,dLat);
      document.getElementById('label').textContent=label||'LIVE LOCATION';
      fit();
    }
    window.snapnestClearJob=function(){
      if(pickupMarker){pickupMarker.remove();pickupMarker=null}
      if(destinationMarker){destinationMarker.remove();destinationMarker=null}
      document.getElementById('label').textContent='LIVE LOCATION'; fit();
    }
  </script>
</body>
</html>
