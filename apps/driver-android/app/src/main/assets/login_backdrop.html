<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
  <link href="https://unpkg.com/maplibre-gl@5.7.1/dist/maplibre-gl.css" rel="stylesheet" />
  <script src="https://unpkg.com/maplibre-gl@5.7.1/dist/maplibre-gl.js"></script>
  <style>
    html,body,#map{margin:0;width:100%;height:100%;background:#071a27;overflow:hidden}
    .maplibregl-map{filter:grayscale(.12) brightness(.48) saturate(.72) contrast(1.08)}
    .maplibregl-ctrl-bottom-left,.maplibregl-ctrl-bottom-right{display:none}
    body:after{content:'';position:absolute;inset:0;pointer-events:none;background:linear-gradient(180deg,rgba(4,18,28,.18) 0%,rgba(4,18,28,.30) 42%,rgba(4,18,28,.88) 100%)}
  </style>
</head>
<body>
<div id="map"></div>
<script>
  const map = new maplibregl.Map({
    container:'map',
    style:'https://tiles.openfreemap.org/styles/liberty',
    center:[-58.155,6.812],
    zoom:12.6,
    attributionControl:false,
    interactive:false,
    pitch:18,
    bearing:-7
  });
</script>
</body>
</html>
