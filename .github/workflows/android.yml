name: android-driver

on:
  push:
    branches: [main, production-deploy]
    paths:
      - 'apps/driver-android/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

jobs:
  build-field-test-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Dispatch
        uses: actions/checkout@v4

      - name: Checkout official SnapNest brand
        uses: actions/checkout@v4
        with:
          repository: oscarjacobis1-code/snapnestweb
          path: .brand-source

      - name: Use official SnapNest app mark
        shell: bash
        run: |
          BRAND_SOURCE=".brand-source/snapnest-v2/favicon.png"
          BRAND_DIR="apps/driver-android/app/src/main/res/drawable"
          test -f "$BRAND_SOURCE"
          mkdir -p "$BRAND_DIR"
          rm -f "$BRAND_DIR/snapnest_brand.xml"
          cp "$BRAND_SOURCE" "$BRAND_DIR/snapnest_brand.png"

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Read app version
        id: version
        shell: bash
        run: |
          VERSION_NAME=$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' apps/driver-android/app/build.gradle.kts | head -n 1)
          if [ -z "$VERSION_NAME" ]; then
            echo "Unable to determine Android versionName" >&2
            exit 1
          fi
          echo "name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "apk=snapnest-dispatch-driver-v${VERSION_NAME}-field-test.apk" >> "$GITHUB_OUTPUT"

      - name: Build live field-test APK
        working-directory: apps/driver-android
        run: gradle --no-daemon assembleDebug -PDISPATCH_API_URL=https://snapnest-dispatch.onrender.com

      - name: Name field-test APK
        run: cp apps/driver-android/app/build/outputs/apk/debug/app-debug.apk "${{ steps.version.outputs.apk }}"

      - name: Upload field-test APK
        uses: actions/upload-artifact@v4
        with:
          name: snapnest-dispatch-driver-v${{ steps.version.outputs.name }}-field-test
          path: ${{ steps.version.outputs.apk }}
          if-no-files-found: error
          retention-days: 30
