name: android-driver

on:
  push:
    branches: [main, production-deploy]
    paths:
      - 'apps/driver-android/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

jobs:
  build-field-test-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build live field-test APK
        working-directory: apps/driver-android
        run: gradle --no-daemon assembleDebug -PDISPATCH_API_URL=https://snapnest-dispatch.onrender.com

      - name: Name field-test APK
        run: cp apps/driver-android/app/build/outputs/apk/debug/app-debug.apk snapnest-dispatch-driver-v0.4.0-field-test.apk

      - name: Upload field-test APK
        uses: actions/upload-artifact@v4
        with:
          name: snapnest-dispatch-driver-v0.4.0-field-test
          path: snapnest-dispatch-driver-v0.4.0-field-test.apk
          if-no-files-found: error
          retention-days: 30
